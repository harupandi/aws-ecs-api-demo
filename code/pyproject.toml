[project]
name = "app"
version = "0.1.0"
description = "API project deployed in AWS"
readme = "README.md"
authors = [
    { name = "Bryan Pineda", email = "bryan.pinedag@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
